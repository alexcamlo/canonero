<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Cañonero</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2b27a; }
      canvas { display: block; }
      #hud, #hud-warning { position: fixed; font: 600 14px/1 system-ui, sans-serif; letter-spacing: 0.08em; color: #fff4e0; text-shadow: 0 1px 6px rgba(80, 40, 10, 0.5); pointer-events: none; transition: opacity 1s; }
      #hud { top: 16px; left: 16px; display: flex; gap: 20px; }
      #hud-warning { top: 16px; right: 16px; opacity: 0; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #touch button { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); border: 0; border-radius: 16px; background: rgba(255, 244, 224, 0.28); color: #fff4e0; font: 600 16px system-ui, sans-serif; text-shadow: 0 1px 4px rgba(80, 40, 10, 0.5); touch-action: none; -webkit-tap-highlight-color: transparent; }
      #touch button:active { background: rgba(255, 244, 224, 0.5); }
      #touch .left, #touch .right { width: 84px; height: 84px; font-size: 28px; }
      #touch .left { left: calc(16px + env(safe-area-inset-left)); }
      #touch .right { left: calc(112px + env(safe-area-inset-left)); }
      #touch .gas, #touch .brake { width: 84px; height: 120px; }
      #touch .gas { right: calc(16px + env(safe-area-inset-right)); }
      #touch .brake { right: calc(112px + env(safe-area-inset-right)); height: 84px; }
      #touch .tools { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; }
      #touch .tools button { position: static; width: 64px; height: 44px; padding: 0; font-size: 13px; }
      @media (orientation: portrait) { #touch .tools { bottom: calc(150px + env(safe-area-inset-bottom)); } }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
